# A tag like v0.1.0 builds mdread.exe and publishes a GitHub release. The first release gets a short note;
# later ones list the commits since the previous tag, grouped by type (Conventional Commits, see cliff.toml).
# Third-party actions are pinned to commits (the version is in the comment), so a moved tag cannot change the build.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag matches the version in Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" }
      - name: Previous tag
        id: previous
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
          "first=$(if ($LASTEXITCODE -ne 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Release notes (first release)
        if: steps.previous.outputs.first == 'true'
        shell: pwsh
        run: Set-Content -Path RELEASE_NOTES.md -Value 'First public release.'
      - name: Release notes (commits since the previous tag)
        if: steps.previous.outputs.first != 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: RELEASE_NOTES.md
          files: target/release/mdread.exe
