# git-cliff: release notes from Conventional Commits, grouped by type; only the first line of each commit
# (task references like MDR-12 in the body are left out).

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  # Version bumps and CI changes are not interesting in release notes.
  { message = "^chore: release", skip = true },
  { message = "^ci", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = ".*", group = "<!-- 3 -->Other" },
]
