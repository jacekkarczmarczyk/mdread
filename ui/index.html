<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="app.css">
<!-- Strings in the UI language (generated by the app), then the page script -->
<script src="strings.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<nav id="tabbar">
  <div id="tabs" role="tablist"></div>
  <button id="new-tab" type="button" data-i18n-title="tab.open">+</button>
  <div id="tab-list-tools" class="dropdown" hidden>
    <button id="tab-list-button" type="button" data-i18n-title="tab.list" aria-haspopup="menu">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
    </button>
    <div id="tab-list" class="menu" role="menu" hidden></div>
  </div>
  <div id="tools">
    <!-- Per-tab toggles: on (aria-pressed=true), off (formulas and diagrams with a crossed-out
         icon, .off-slash) or unavailable (disabled: the file has no formulas / diagrams) -->
    <div id="view-toggles" class="button-group" hidden>
      <button id="outline-toggle" class="tool toggle" type="button" aria-pressed="false" data-i18n-title="outline.button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M5 8h8.5M7.5 12h6M2.5 8h.01M2.5 12h.01M5 12h.01"/></svg>
      </button>
      <button id="math-toggle" class="tool toggle" type="button" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3.5H4.5L8.5 8l-4 4.5H12"/><path class="off-slash" d="M2 2l12 12"/></svg>
      </button>
      <button id="diagram-toggle" class="tool toggle" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="5" height="4" rx="1"/><rect x="9" y="9.5" width="5" height="4" rx="1"/><path d="M4.5 6.5v3a2 2 0 0 0 2 2H9"/><path class="off-slash" d="M2 2l12 12"/></svg>
      </button>
    </div>
    <div id="edit-tools" class="dropdown split" hidden>
      <button id="edit" class="tool" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3zM9 4l3 3"/></svg>
        <span data-i18n="edit.button"></span>
      </button>
      <button id="edit-menu-button" class="tool" type="button" data-i18n-title="edit.choose" aria-haspopup="menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div id="edit-menu" class="menu" role="menu" hidden>
        <div id="editor-list"></div>
        <hr>
        <button type="button" role="menuitem" data-action="chooseEditor">
          <svg class="menu-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          <span data-i18n="edit.chooseProgram"></span>
        </button>
      </div>
    </div>
    <div class="dropdown">
      <button id="appearance-button" class="tool" type="button" data-i18n-title="appearance.button" aria-haspopup="menu">
        <!-- Gear with thick teeth (shape like "settings" from Lucide, ISC license) -->
        <svg class="icon-24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div id="appearance-menu" class="menu" role="menu" hidden>
        <div class="menu-label" data-i18n="appearance.theme"></div>
        <button type="button" role="menuitemradio" data-theme="github">GitHub</button>
        <button type="button" role="menuitemradio" data-theme="jetbrains">JetBrains</button>
        <button type="button" role="menuitemradio" data-theme="vscode">VS Code</button>
        <button type="button" role="menuitemradio" data-theme="fluent" data-i18n="theme.fluent"></button>
        <button type="button" role="menuitemradio" data-theme="reading" data-i18n="theme.reading"></button>
        <hr>
        <div class="menu-label" data-i18n="appearance.mode"></div>
        <button type="button" role="menuitemradio" data-mode="system" data-i18n="mode.system"></button>
        <button type="button" role="menuitemradio" data-mode="light" data-i18n="mode.light"></button>
        <button type="button" role="menuitemradio" data-mode="dark" data-i18n="mode.dark"></button>
        <hr>
        <div class="menu-label" data-i18n="appearance.language"></div>
        <button type="button" role="menuitemradio" data-language="system" data-i18n="language.system"></button>
        <button type="button" role="menuitemradio" data-language="pl" lang="pl">Polski</button>
        <button type="button" role="menuitemradio" data-language="en" lang="en">English</button>
        <hr>
        <div class="menu-label" data-i18n="outline.title"></div>
        <button type="button" role="menuitemcheckbox" data-outline-default data-i18n="outline.openByDefault"></button>
        <hr>
        <div class="menu-label" id="update-section"></div>
        <button type="button" role="menuitemcheckbox" data-update-check data-i18n="update.check"></button>
        <hr>
        <button type="button" role="menuitem" data-action="help" data-i18n="help.button"></button>
      </div>
    </div>
  </div>
</nav>
<div id="tab-menu" class="menu" role="menu" hidden>
  <button type="button" role="menuitem" data-action="close" data-i18n="tab.closeThis"></button>
  <button type="button" role="menuitem" data-action="closeOthers" data-i18n="tab.closeOthers"></button>
  <button type="button" role="menuitem" data-action="closeLeft" data-i18n="tab.closeLeft"></button>
  <button type="button" role="menuitem" data-action="closeRight" data-i18n="tab.closeRight"></button>
  <hr>
  <button type="button" role="menuitem" data-action="closeAll" data-i18n="tab.closeAll"></button>
  <hr>
  <button type="button" role="menuitem" data-action="reveal" data-i18n="tab.reveal"></button>
  <button type="button" role="menuitem" data-action="revealInTotalCommander" data-i18n="tab.revealInTotalCommander" hidden></button>
</div>
<section id="installer" hidden>
  <form id="installer-form" class="installer-card">
    <h1 data-i18n="install.title"></h1>
    <p id="installer-intro" class="installer-intro"></p>
    <label class="check"><input type="checkbox" name="associate" checked> <span data-i18n="install.associate"></span></label>
    <p class="hint" data-i18n="install.associateHint"></p>
    <div class="field-label" data-i18n="install.editor"></div>
    <div id="installer-editors" class="choice-list"></div>
    <label class="check"><input type="checkbox" name="startMenu" checked> <span data-i18n="install.startMenu"></span></label>
    <label class="check"><input type="checkbox" name="desktop"> <span data-i18n="install.desktop"></span></label>
    <p id="installer-error" class="installer-error" hidden></p>
    <div id="installer-buttons" class="installer-buttons"></div>
  </form>
</section>
<div id="file-bars"></div>
<div id="workspace">
  <aside id="outline" hidden>
    <div class="outline-header">
      <span data-i18n="outline.title"></span>
      <div id="outline-levels" role="group">
        <button type="button" data-depth="1">H1</button>
        <button type="button" data-depth="2">H2</button>
        <button type="button" data-depth="3">H3</button>
        <button type="button" data-depth="4">H4</button>
      </div>
      <button id="outline-close" class="outline-close" type="button" data-i18n-title="outline.close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <nav id="outline-list"></nav>
    <div id="outline-resizer" data-i18n-title="outline.resize"></div>
  </aside>
  <main id="docs">
    <div id="empty">
      <p data-i18n-html="empty"></p>
    </div>
  </main>
</div>
<div id="update-bar" hidden>
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg>
  <span id="update-text"></span>
  <span id="update-buttons"></span>
</div>
</body>
</html>
